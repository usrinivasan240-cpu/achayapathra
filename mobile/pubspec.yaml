name: achayapathra
description: Achayapathra - India's AI-Powered Circular Food Economy Platform
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  google_fonts: ^6.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  cached_network_image: ^3.3.1
  qr_flutter: ^4.1.0
  share_plus: ^7.2.1
  url_launcher: ^6.2.2
  intl: ^0.19.0
  fl_chart: ^0.66.0
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
